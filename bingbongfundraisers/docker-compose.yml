version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bingbong-backend
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: bingbong-frontend
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: bingbong-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bingbongfundraisers
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
